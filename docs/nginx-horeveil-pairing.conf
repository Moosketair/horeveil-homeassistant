# Include in the http context after replacing the example hostname and paths.
# This virtual host exclusively serves pairing. No shared HA upstream.
limit_req_zone $realip_remote_addr zone=horeveil_pairing:1m rate=12r/m;

server {
    listen 443 ssl;
    server_name pairing.example.invalid;
    ssl_certificate /chemin/prive/public.pem;
    ssl_certificate_key /chemin/prive/public.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /chemin/prive/horeveil-nginx-error.log crit;

    if ($host != pairing.example.invalid) { return 421; }

    location ~ ^/api/horeveil/v1/pair/(claim|status|activate)$ {
        if ($request_uri != $uri) { return 404; }
        limit_req zone=horeveil_pairing burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        client_body_timeout 5s;

        proxy_pass https://127.0.0.1:18443;
        proxy_ssl_certificate /chemin/prive/proxy.pem;
        proxy_ssl_certificate_key /chemin/prive/proxy.key;
        proxy_ssl_trusted_certificate /chemin/prive/ca.pem;
        proxy_ssl_verify on;
        proxy_ssl_server_name on;
        proxy_ssl_name horeveil-gateway.example.invalid;
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header X-Horeveil-Invitation $http_x_horeveil_invitation;
        proxy_set_header X-Horeveil-Authorization $http_x_horeveil_authorization;
        proxy_set_header X-Horeveil-Proxy-Scheme $scheme;
        proxy_set_header X-Horeveil-Proxy-Origin https://pairing.example.invalid;
        proxy_set_header X-Horeveil-Proxy-Client-IP $realip_remote_addr;
        proxy_cache off;
        proxy_redirect off;
        proxy_hide_header Location;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 502 503 504 =404 /_horeveil_refused;
    }
    location = /_horeveil_refused { internal; return 404; }
    location / { return 404; }
}
