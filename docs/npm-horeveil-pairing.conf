# Champ Advanced du Proxy Host HTTPS dédié. Remplacer le domaine et confirmer l'amont.
# Désactiver Force SSL, Cache Assets et Websockets Support sur cet hôte.
# Le modèle NPM supprime son location / automatique en présence de celui-ci.
location / { return 404; }

location ~ ^/api/horeveil/v1/pair/(claim|status|activate)$ {
    if ($scheme != https) { return 404; }
    if ($ssl_server_name != pairing.example.invalid) { return 404; }
    if ($host != pairing.example.invalid) { return 404; }
    if ($request_uri != $uri) { return 404; }
    if ($http_content_encoding != "") { return 400; }
    set $horeveil_route "$request_method:$uri";
    if ($horeveil_route !~ "^(POST:/api/horeveil/v1/pair/(claim|activate)|GET:/api/horeveil/v1/pair/status)$") { return 405; }

    access_log off;
    error_log /dev/null crit;
    client_max_body_size 4k;
    client_body_timeout 5s;

    proxy_pass $forward_scheme://$server:$port;
    # Obligatoire pour un amont HTTPS. Adapter le nom et la CA à Core.
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_ssl_name ha-interne.example.invalid;
    proxy_ssl_trusted_certificate /data/nginx/custom/horeveil-upstream-ca.pem;

    proxy_pass_request_headers off;
    proxy_set_header Host pairing.example.invalid;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header X-Horeveil-Invitation $http_x_horeveil_invitation;
    proxy_set_header X-Horeveil-Authorization $http_x_horeveil_authorization;
    proxy_set_header X-Forwarded-For $realip_remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Horeveil-Proxy-Origin https://pairing.example.invalid;
    include /data/nginx/custom/horeveil-relay-secret.inc;

    proxy_cache off;
    proxy_redirect off;
    proxy_hide_header Location;
    proxy_intercept_errors on;
    error_page 301 302 303 307 308 502 503 504 =404 /_horeveil_refused;
}

location = /_horeveil_refused { internal; return 404; }
